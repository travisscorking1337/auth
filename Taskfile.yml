version: '3'

dotenv:
  - .env

vars:
  BINARY: bin/auth
  GOOSE_VERSION: v3.24.1

tasks:
  run:
    desc: Run Auth locally
    cmds:
      - go run ./cmd

  build:
    desc: Build the Auth binary
    cmds:
      - mkdir -p bin
      - go build -o {{.BINARY}} ./cmd

  db:up:
    desc: Start PostgreSQL
    cmds:
      - docker compose up -d postgres

  up:
    desc: Build and start Auth with PostgreSQL
    cmds:
      - docker compose up --build

  down:
    desc: Stop Compose services and preserve database data
    cmds:
      - docker compose down

  logs:
    desc: Follow Compose logs
    cmds:
      - docker compose logs -f

  goose:install:
    desc: Install the pinned goose version
    cmds:
      - go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}

  migrate:create:
    desc: Create a SQL migration (task migrate:create -- migration_name)
    cmds:
      - goose -dir migrations create {{.CLI_ARGS}} sql

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - |
        export GOOSE_DBSTRING="host=$${DB_HOST} port=$${DB_PORT} dbname=$${DB_NAME} user=$${DB_USER} password=$${DB_PASSWORD} sslmode=$${DB_SSLMODE}"
        goose -dir migrations postgres "$${GOOSE_DBSTRING}" up

  migrate:down:
    desc: Roll back the latest migration
    cmds:
      - |
        export GOOSE_DBSTRING="host=$${DB_HOST} port=$${DB_PORT} dbname=$${DB_NAME} user=$${DB_USER} password=$${DB_PASSWORD} sslmode=$${DB_SSLMODE}"
        goose -dir migrations postgres "$${GOOSE_DBSTRING}" down

  migrate:status:
    desc: Show migration status
    cmds:
      - |
        export GOOSE_DBSTRING="host=$${DB_HOST} port=$${DB_PORT} dbname=$${DB_NAME} user=$${DB_USER} password=$${DB_PASSWORD} sslmode=$${DB_SSLMODE}"
        goose -dir migrations postgres "$${GOOSE_DBSTRING}" status
